<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Hooks — Logo Matching v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #1a1a2e; color: #fff; padding: 3rem; display: flex; flex-direction: column; align-items: center; gap: 3rem; min-height: 100vh; }
    h2 { font-size: 0.8rem; color: #8888a0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .row { display: flex; gap: 3rem; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
    .variant { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
    .variant label { font-size: 0.75rem; color: #8888a0; }
    .box { border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .dark { background: #1a1a2e; border: 1px solid #2a2a4e; }
    .light { background: #f0f0f5; }
    .navbar-test { background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 12px; padding: 0.8rem 1.2rem; display: flex; align-items: center; gap: 0.6rem; }
    .navbar-test .name { color: #fff; font-weight: 700; font-size: 1rem; }
    .full-logo { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
    .full-logo .wordmark { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  </style>
</head>
<body>

  <h2>Large Preview — Open Bowl "d" (bowl does NOT close)</h2>

  <div class="row">

    <!-- Version A: Bowl ends far from stem, big gap -->
    <div class="variant">
      <label>A — Big gap, bowl ends left</label>
      <div class="box dark" style="width:200px;height:200px;">
        <svg viewBox="0 0 32 40" width="100" height="125" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gA" x1="4" y1="38" x2="26" y2="2" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c0354a"/>
              <stop offset="50%" stop-color="#d6456b"/>
              <stop offset="100%" stop-color="#f4a0b0"/>
            </linearGradient>
          </defs>
          <!-- Stem: right side, top to bottom -->
          <path d="M24 3 V27" stroke="url(#gA)" stroke-width="4.5" stroke-linecap="round"/>
          <!-- Bowl: starts at stem bottom, sweeps counterclockwise, STOPS well before reaching stem -->
          <path d="M24 27 C24 34 15 38 8 35 C2 32 0 26 1 20 C2 15 6 11.5 11 11" stroke="url(#gA)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>

    <!-- Version B: Bowl ends with slight inward curl -->
    <div class="variant">
      <label>B — Inward curl at end</label>
      <div class="box dark" style="width:200px;height:200px;">
        <svg viewBox="0 0 32 40" width="100" height="125" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gB" x1="4" y1="38" x2="26" y2="2" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c0354a"/>
              <stop offset="50%" stop-color="#d6456b"/>
              <stop offset="100%" stop-color="#f4a0b0"/>
            </linearGradient>
          </defs>
          <path d="M24 3 V27" stroke="url(#gB)" stroke-width="4.5" stroke-linecap="round"/>
          <!-- Bowl sweeps around and ends curling slightly inward/down — the hook tip -->
          <path d="M24 27 C24 34 15 38 8 35 C2 32 0 26 1 20 C2 14.5 6 11 12 10.5 C15 10.3 17 11 17.5 12.5" stroke="url(#gB)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>

    <!-- Version C: Closer to TikTok-like proportions, thicker, rounder -->
    <div class="variant">
      <label>C — Rounder, thicker</label>
      <div class="box dark" style="width:200px;height:200px;">
        <svg viewBox="0 0 32 42" width="96" height="126" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gC" x1="4" y1="40" x2="26" y2="2" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c0354a"/>
              <stop offset="50%" stop-color="#d6456b"/>
              <stop offset="100%" stop-color="#f4a0b0"/>
            </linearGradient>
          </defs>
          <path d="M24 3 V26" stroke="url(#gC)" stroke-width="5" stroke-linecap="round"/>
          <!-- Rounder, fuller bowl -->
          <path d="M24 26 C24 36 13 40 6 36 C0 32 -1 24 1 18 C3 12 8 9 14 9" stroke="url(#gC)" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>

    <!-- Version D: Bowl curls inward more dramatically -->
    <div class="variant">
      <label>D — Strong hook curl</label>
      <div class="box dark" style="width:200px;height:200px;">
        <svg viewBox="0 0 32 42" width="96" height="126" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gD" x1="4" y1="40" x2="26" y2="2" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c0354a"/>
              <stop offset="50%" stop-color="#d6456b"/>
              <stop offset="100%" stop-color="#f4a0b0"/>
            </linearGradient>
          </defs>
          <path d="M24 3 V26" stroke="url(#gD)" stroke-width="5" stroke-linecap="round"/>
          <!-- Bowl sweeps around, then curls inward toward center -->
          <path d="M24 26 C24 36 13 40 6 36 C0 32 -1 24 1 18 C3 12.5 7.5 9.5 13 9.5 C16.5 9.5 18.5 11 18.5 13" stroke="url(#gD)" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>

  </div>

  <!-- Navbar size -->
  <h2>Navbar Size (white)</h2>
  <div class="row">
    <div class="navbar-test">
      <svg viewBox="0 0 32 40" width="20" height="25" fill="none"><path d="M24 3 V27" stroke="white" stroke-width="4.5" stroke-linecap="round"/><path d="M24 27 C24 34 15 38 8 35 C2 32 0 26 1 20 C2 15 6 11.5 11 11" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>
      <span class="name">A — Data Hooks</span>
    </div>
    <div class="navbar-test">
      <svg viewBox="0 0 32 40" width="20" height="25" fill="none"><path d="M24 3 V27" stroke="white" stroke-width="4.5" stroke-linecap="round"/><path d="M24 27 C24 34 15 38 8 35 C2 32 0 26 1 20 C2 14.5 6 11 12 10.5 C15 10.3 17 11 17.5 12.5" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>
      <span class="name">B — Data Hooks</span>
    </div>
    <div class="navbar-test">
      <svg viewBox="0 0 32 42" width="18" height="24" fill="none"><path d="M24 3 V26" stroke="white" stroke-width="5" stroke-linecap="round"/><path d="M24 26 C24 36 13 40 6 36 C0 32 -1 24 1 18 C3 12 8 9 14 9" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
      <span class="name">C — Data Hooks</span>
    </div>
    <div class="navbar-test">
      <svg viewBox="0 0 32 42" width="18" height="24" fill="none"><path d="M24 3 V26" stroke="white" stroke-width="5" stroke-linecap="round"/><path d="M24 26 C24 36 13 40 6 36 C0 32 -1 24 1 18 C3 12.5 7.5 9.5 13 9.5 C16.5 9.5 18.5 11 18.5 13" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
      <span class="name">D — Data Hooks</span>
    </div>
  </div>

  <!-- Full lockup -->
  <h2>Full Lockup (Version B)</h2>
  <div class="full-logo">
    <svg viewBox="0 0 32 40" width="80" height="100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gFull" x1="4" y1="38" x2="26" y2="2" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#c0354a"/>
          <stop offset="50%" stop-color="#d6456b"/>
          <stop offset="100%" stop-color="#f4a0b0"/>
        </linearGradient>
      </defs>
      <path d="M24 3 V27" stroke="url(#gFull)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M24 27 C24 34 15 38 8 35 C2 32 0 26 1 20 C2 14.5 6 11 12 10.5 C15 10.3 17 11 17.5 12.5" stroke="url(#gFull)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="wordmark">data hooks</span>
  </div>

</body>
</html>
